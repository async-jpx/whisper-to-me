[package]
name = "whisper-to-me-desktop"
version = "0.1.0"
description = "Menu-bar shell around the local whisper-to-me daemon"
edition = "2021"

[lib]
name = "whisper_to_me_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
serde_json = "1"
# Everything below talks only to the loopback daemon (127.0.0.1:8737);
# the shell itself must never make an off-machine request.
ureq = { version = "2", features = ["json"] }
tungstenite = "0.24"
libc = "0.2"

# Already in the lock graph through tao; the overlay needs AppKit calls tao
# does not expose (see prompt.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPanel", "NSResponder", "NSWindow"] }
