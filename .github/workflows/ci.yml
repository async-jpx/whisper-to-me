name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src/
      - run: uv run pytest tests/ -q

  webui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - name: committed dist matches the source
        run: git diff --exit-code --stat -- src/whisper_to_me/static/dist && test -z "$(git status --porcelain -- src/whisper_to_me/static/dist)"

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
