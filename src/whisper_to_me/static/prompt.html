<!doctype html>
<!-- Meeting-prompt widget: a tiny page the desktop shell shows in a small
     always-on-top window when the daemon detects a meeting (state
     "prompting"). Served by the local daemon, so the fetches below are
     same-origin loopback calls; no external assets, ever. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting detected</title>
<style>
  /* The window is transparent and borderless (prompt.rs): the card draws its
     own rounded corners and shadow, inset by --gutter so the shadow fits. */
  :root {
    --gutter: 14px;
    --card: #ffffff; --card-edge: rgba(15, 23, 42, 0.10);
    --text: #1f2328; --text-secondary: #6b7280;
    --accent: #2383e2; --accent-hover: #1a73cc; --on-accent: #fff;
    --neutral: rgba(15, 23, 42, 0.06); --neutral-hover: rgba(15, 23, 42, 0.10);
    --track: rgba(15, 23, 42, 0.06);
    --box: #ffffff; --box-edge: rgba(15, 23, 42, 0.26); --box-edge-hover: rgba(15, 23, 42, 0.42);
    --mark: #0f172a; --mark-bar: #7cc4ff;
    --shadow: 0 10px 28px -6px rgba(15, 23, 42, 0.28), 0 2px 6px rgba(15, 23, 42, 0.10);
    --highlight: transparent;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #232326; --card-edge: rgba(255, 255, 255, 0.09);
      --text: #ececec; --text-secondary: #9a9aa0;
      --accent: #4dabf7; --accent-hover: #6cb9f8; --on-accent: #0b1a2b;
      --neutral: rgba(255, 255, 255, 0.07); --neutral-hover: rgba(255, 255, 255, 0.12);
      --track: rgba(255, 255, 255, 0.06);
      --box: rgba(255, 255, 255, 0.04); --box-edge: rgba(255, 255, 255, 0.26);
      --box-edge-hover: rgba(255, 255, 255, 0.42);
      --mark: #0f172a; --mark-bar: #4dabf7;
      --shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4);
      --highlight: rgba(255, 255, 255, 0.06);
    }
  }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    padding: var(--gutter); box-sizing: border-box;
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
    -webkit-user-select: none; user-select: none; cursor: default;
    overflow: hidden;
  }
  .card {
    position: relative; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 14px 14px 16px;
    background: var(--card); border-radius: 16px;
    box-shadow: var(--shadow), 0 0 0 0.5px var(--card-edge),
      inset 0 1px 0 var(--highlight);
    overflow: hidden;
  }

  .top { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
  .mark {
    flex: none; width: 34px; height: 34px; border-radius: 9px;
    background: var(--mark);
    display: flex; align-items: center; justify-content: center; gap: 2.5px;
    box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  }
  .mark i {
    display: block; width: 3px; height: 16px; border-radius: 2px;
    background: var(--mark-bar); transform-origin: center;
    animation: wave 1.1s ease-in-out infinite;
  }
  .mark i:nth-child(1) { animation-delay: -0.9s; height: 9px; }
  .mark i:nth-child(2) { animation-delay: -0.6s; }
  .mark i:nth-child(3) { animation-delay: -0.3s; height: 13px; }
  .mark i:nth-child(4) { animation-delay: 0s; height: 7px; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.45); }
    50% { transform: scaleY(1); }
  }

  .text { flex: 1; min-width: 0; }
  .eyebrow {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 11.5px; color: var(--text-secondary);
  }
  .eyebrow b { font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .eyebrow .sep { opacity: 0.5; }
  .eyebrow .spacer { flex: 1; }
  #countdown {
    font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 500;
  }
  #title {
    margin-top: 2px; font-weight: 600; font-size: 14px; letter-spacing: -0.01em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #source {
    margin-top: 1px; font-size: 12px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #source:empty { display: none; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* With an app to ignore: the macOS suppression-checkbox layout — the
     option bottom-left, the buttons at their natural width on the right. */
  .actions.with-ignore { display: flex; align-items: center; }
  .actions.with-ignore button { padding: 0 14px; }

  .ignore {
    position: relative; flex: 1; min-width: 0; height: 30px;
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-secondary); cursor: pointer;
    transition: color 120ms ease;
  }
  .ignore[hidden] { display: none; }
  .ignore:hover { color: var(--text); }
  .ignore input {
    position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0;
    pointer-events: none;
  }
  .ignore .box {
    flex: none; width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: var(--box); box-shadow: inset 0 0 0 1px var(--box-edge);
    transition: background-color 120ms ease, box-shadow 120ms ease;
  }
  .ignore:hover .box { box-shadow: inset 0 0 0 1px var(--box-edge-hover); }
  .ignore .box svg {
    width: 10px; height: 10px; fill: none; stroke: var(--on-accent);
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0; transform: scale(0.6);
    transition: opacity 120ms ease, transform 120ms ease;
  }
  .ignore input:checked + .box { background: var(--accent); box-shadow: none; }
  .ignore input:checked + .box svg { opacity: 1; transform: none; }
  .ignore input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ignore input:disabled ~ * { opacity: 0.45; }
  .ignore-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; font-size: 13px; font-weight: 500;
    height: 30px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--neutral); color: var(--text);
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    transition: background-color 120ms ease, transform 80ms ease;
  }
  button:hover:not(:disabled) { background: var(--neutral-hover); }
  button:active:not(:disabled) { transform: scale(0.98); }
  button.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rec {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 30%, transparent);
  }

  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--track);
  }
  #bar {
    display: block; height: 100%; width: 100%; background: var(--accent);
    opacity: 0.85; transition: width 250ms linear;
  }

  @media (prefers-reduced-motion: reduce) {
    .mark i { animation: none; }
    #bar { transition: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="text">
        <div class="eyebrow">
          <b>Hush</b><span class="sep">·</span><span>Meeting detected</span>
          <span class="spacer"></span><span id="countdown"></span>
        </div>
        <div id="title">Meeting</div>
        <div id="source"></div>
      </div>
    </div>
    <div class="actions" id="actions">
      <label class="ignore" id="ignore" hidden>
        <input type="checkbox" id="ignore-box">
        <span class="box" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M2 5.2 4.1 7.3 8 2.8"/></svg></span>
        <span class="ignore-text">Don't ask for this app</span>
      </label>
      <button id="dismiss" disabled>Dismiss</button>
      <button id="record" class="primary" disabled><span class="rec"></span><span>Record</span></button>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </div>
<script>
"use strict";
(function () {
  const titleEl = document.getElementById("title");
  const sourceEl = document.getElementById("source");
  const recordBtn = document.getElementById("record");
  const dismissBtn = document.getElementById("dismiss");
  const actionsEl = document.getElementById("actions");
  const ignoreEl = document.getElementById("ignore");
  const ignoreBox = document.getElementById("ignore-box");
  const countdownEl = document.getElementById("countdown");
  const barEl = document.getElementById("bar");
  const SOURCES = { zoom: "Zoom call", mic: "Microphone in use" };

  let promptId = null;
  let deadlineMs = 0;
  let timeoutS = 60;

  function setEnabled(on) {
    recordBtn.disabled = dismissBtn.disabled = ignoreBox.disabled = !on;
  }

  function apply(status) {
    const p = status && status.prompt;
    if (!p) {
      promptId = null;
      setEnabled(false);
      countdownEl.textContent = "";
      barEl.style.width = "0%";
      return;
    }
    if (p.id !== promptId) {
      promptId = p.id;
      ignoreBox.checked = false;
      setEnabled(true);
    }
    titleEl.textContent = p.title || "Meeting";
    sourceEl.textContent = (p.trigger !== "zoom" && p.app) || SOURCES[p.trigger] || "";
    ignoreEl.hidden = !p.app;
    ignoreEl.title = p.app ? `Never ask when ${p.app} uses the microphone` : "";
    actionsEl.classList.toggle("with-ignore", Boolean(p.app));
    timeoutS = p.timeout_s > 0 ? p.timeout_s : 60;
    deadlineMs = performance.now() + p.expires_in_s * 1000;
    tick();
  }

  function tick() {
    if (promptId === null) return;
    const left = Math.max(0, (deadlineMs - performance.now()) / 1000);
    countdownEl.textContent = `${Math.ceil(left)}s`;
    barEl.style.width = `${Math.min(1, left / timeoutS) * 100}%`;
  }
  setInterval(tick, 250);

  function resync() {
    return fetch("/api/status").then((r) => r.json()).then(apply).catch(() => {});
  }

  async function respond(answer) {
    if (promptId === null) return;
    const id = promptId;
    setEnabled(false);
    let ok = false;
    try {
      const resp = await fetch(`/api/prompts/${encodeURIComponent(id)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answer, ignore_app: !ignoreEl.hidden && ignoreBox.checked }),
      });
      ok = resp.ok;
    } catch (err) {}
    if (!ok) {
      promptId = null;
      await resync();
    }
  }
  recordBtn.addEventListener("click", () => respond("record"));
  dismissBtn.addEventListener("click", () => respond("dismiss"));

  resync();

  // Follow status events so a prompt that changes (or a reconnect) stays
  // accurate even while the window is visible.
  function connect() {
    const ws = new WebSocket(`ws://${location.host}/api/events`);
    ws.addEventListener("message", (msg) => {
      try {
        const evt = JSON.parse(msg.data);
        if (evt.type === "status") apply(evt);
      } catch (err) { /* ignore malformed frames */ }
    });
    ws.addEventListener("close", () => setTimeout(connect, 2000));
    ws.addEventListener("error", () => ws.close());
  }
  connect();
})();
</script>
</body>
</html>
